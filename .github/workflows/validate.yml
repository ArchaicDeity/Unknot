name: Validate Unknot

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install graph development dependency
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify graph assets and models
        run: npm run verify:vendor && npm test
      - name: Install dependencies
        run: |
          docker run --rm -e COMPOSER_ALLOW_SUPERUSER=1 -e COMPOSER_HOME=/tmp/composer \
            -v "$PWD:/app" -w /app --entrypoint sh \
            composer@sha256:66c00f4ea1c6a01364d75460bb2837886388e1d5b2b1b6e0f22c8788eb4e73ad \
            -c 'composer --no-cache install --no-interaction --no-scripts --prefer-dist && cp /usr/bin/composer /app/.composer-ci.phar'
      - name: Test on PHP 8.5.12
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,noexec,size=128m -e COMPOSER_ALLOW_SUPERUSER=1 -e COMPOSER_HOME=/tmp/composer \
            -v "$PWD:/app:ro" -w /app --entrypoint sh \
            php@sha256:d4f6e10eb393de7e3a7a88e8b88e139072dd3ae297f6a5dada8257e6fe32c585 \
            -c 'set -e; ulimit -c 0; mkdir /tmp/project; cp -R /app/src /app/bin /app/vendor /app/tests /app/fixtures /app/public /app/demo /tmp/project/; cp /app/composer.json /app/composer.lock /app/.composer-ci.phar /tmp/project/; cd /tmp/project; php .composer-ci.phar test'

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1
        with:
          php-version: '8.5'
          tools: composer:2.10.3
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --no-scripts --prefer-dist
        env:
          COMPOSER_HOME: ${{ runner.temp }}\unknot-composer
      - name: Test
        run: composer test
        env:
          COMPOSER_HOME: ${{ runner.temp }}\unknot-composer
      - name: Windows filesystem checks
        shell: pwsh
        run: |
          ./tests/windows-junction.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/windows-report-acl.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
